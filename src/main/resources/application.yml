spring:
  application:
    name: real-estate-marketplace

  datasource:
    url: jdbc:postgresql://localhost:5432/realestate
    username: realestate
    password: realestate

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
